<text x="668" y="408" fill="#c7ded4" font-size="21"><tspan x="668">Understand the structure.</tspan><tspan x="668" dy="28">Refine it piece by piece.</tspan></text>
<text x="480" y="501" text-anchor="middle" fill="#91a9be" font-size="20">The goal: a project I can still understand and extend.</text>
