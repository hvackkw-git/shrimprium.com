<marker id="coral" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ffb49e" stroke-width="1.3" stroke-linejoin="round"/></marker>
<marker id="green" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9bd8b7" stroke-width="1.3" stroke-linejoin="round"/></marker>
</defs>
